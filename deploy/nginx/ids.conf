# Nginx delante de GlassFish en el VPS (AWS).
# 1) Copiar a /etc/nginx/conf.d/ids.conf y cambiar ids.ideacom.mx por tu subdominio.
# 2) sudo nginx -t && sudo systemctl reload nginx
# 3) Certificado gratuito: sudo certbot --nginx -d ids.ideacom.mx
#    (certbot agrega el bloque HTTPS y la redireccion de HTTP a HTTPS)

server {
    listen 80;
    server_name ids.ideacom.mx;

    # Respaldos e importaciones desde el panel
    client_max_body_size 20m;

    location = / {
        return 302 /ids-web/;
    }

    location /ids-web/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/ids-proxy-headers.inc;
    }

    location /ids-api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/ids-proxy-headers.inc;
    }

    # Cualquier otra ruta de GlassFish queda oculta
    location / {
        return 404;
    }
}
