<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/ids.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>ideacom IDS - Incidencias</title>
</head>
<body>
<div id="barra"></div>
<main class="container-fluid px-4">
  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Incidencias</h1>
    <div class="d-flex gap-2">
      <select id="filtroEstado" class="form-select form-select-sm" style="width:auto">
        <option value="">Todas</option><option value="ABIERTA">Abiertas</option>
        <option value="EN_PROCESO">En proceso</option><option value="CERRADA">Cerradas</option>
      </select>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-download"></i> Exportar</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" data-exportar="csv"><i class="bi bi-filetype-csv"></i> CSV (Excel)</a></li>
          <li><a class="dropdown-item" href="#" data-exportar="json"><i class="bi bi-filetype-json"></i> JSON</a></li>
        </ul>
      </div>
      <button class="btn btn-danger btn-sm" id="btnNueva"><i class="bi bi-plus-lg"></i> Levantar incidencia</button>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>#</th><th>Título</th><th>Dispositivo</th><th>Prioridad</th><th>Estado</th>
          <th>Levantada por</th><th>Asignada a</th><th>Fecha</th></tr></thead>
        <tbody id="tabla"><tr><td colspan="8" class="text-secondary">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="modalNueva" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="formNueva">
      <div class="modal-header"><h5 class="modal-title">Levantar incidencia</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Título *</label>
          <input class="form-control" id="inTitulo" maxlength="150" required placeholder="La cámara de la entrada no graba"></div>
        <div class="mb-3"><label class="form-label">Dispositivo</label>
          <select class="form-select" id="inDispositivo"></select></div>
        <div class="mb-3"><label class="form-label">Prioridad</label>
          <select class="form-select" id="inPrioridad"><option>BAJA</option><option selected>MEDIA</option><option>ALTA</option></select></div>
        <div class="mb-0"><label class="form-label">Descripción</label>
          <textarea class="form-control" id="inDescripcion" rows="4" placeholder="Qué pasó, desde cuándo, qué se intentó"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-danger">Enviar</button>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/incidencias.js"></script>
</body>
</html>
