<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/ids.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>ideacom IDS - Dashboard</title>
</head>
<body>
<div id="barra"></div>
<main class="container-fluid px-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Estado general</h1>
    <small class="text-secondary" id="actualizado"></small>
  </div>

  <div class="row g-3 mb-4" id="metricas"></div>

  <div id="avisoPendientes" class="alert alert-warning d-none">
    <i class="bi bi-hourglass-split"></i> Hay <strong id="numPendientes">0</strong> equipo(s) esperando aprobación.
    <a href="dispositivos.html?registro=PENDIENTE" class="alert-link">Revisar</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-white fw-semibold">Últimos eventos</div>
    <div class="table-responsive">
      <table class="table table-hover mb-0 tabla-compacta">
        <thead class="table-light"><tr><th>Fecha</th><th>Dispositivo</th><th>Evento</th><th>Estado</th><th>Detalle</th></tr></thead>
        <tbody id="eventos"><tr><td colspan="5" class="text-secondary">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
