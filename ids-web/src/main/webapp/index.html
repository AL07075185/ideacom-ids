<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/ids.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>ideacom IDS - Acceso</title>
</head>
<body class="d-flex align-items-center min-vh-100">
<main class="container login-caja">
  <div class="text-center mb-4">
    <h1 class="h3"><i class="bi bi-activity text-primary"></i> ideacom IDS</h1>
    <p class="text-secondary mb-0">Monitoreo de disponibilidad de dispositivos</p>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div id="msg" class="alert alert-warning d-none"></div>
      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo</label>
          <input type="email" class="form-control" id="email" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnEntrar">Entrar</button>
      </form>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
