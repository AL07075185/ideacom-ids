<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/ids.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>ideacom IDS - Mapa de red</title>
</head>
<body>
<div id="barra"></div>
<main class="container-fluid px-4">
  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-2">
    <h1 class="h4 mb-0">Mapa lógico de red</h1>
    <div class="d-flex gap-2 align-items-center">
      <div class="leyenda" id="leyenda"></div>
      <div class="btn-group btn-group-sm" role="group">
        <input type="radio" class="btn-check" name="disposicion" id="dispArbol" checked>
        <label class="btn btn-outline-secondary" for="dispArbol">Árbol</label>
        <input type="radio" class="btn-check" name="disposicion" id="dispLibre">
        <label class="btn btn-outline-secondary" for="dispLibre">Libre</label>
      </div>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-lg-9"><div id="red"></div></div>
    <div class="col-lg-3">
      <div class="card shadow-sm"><div class="card-body" id="panelNodo">
        <p class="text-secondary mb-0">Selecciona un equipo en el mapa para ver su detalle.</p>
      </div></div>
      <p class="small text-secondary mt-3">Las líneas salen del campo <em>Conectado a</em> de cada dispositivo.
        Los switches y routers se agregan como <em>equipo sin agente</em>.</p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="js/mapa.js"></script>
</body>
</html>
